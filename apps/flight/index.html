<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight</title>
<style>
  :root { --bg: #f4f6f8; --fg: #1d232a; --muted: #66707a; --panel: #fff; --line: #d5dbe1; --warn: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14181c; --fg: #e6eaee; --muted: #9aa4ae; --panel: #1d2329; --line: #333c45; --warn: #ff6b6b; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1rem; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 64rem; margin: 0 auto; display: grid; gap: .75rem; }
  header { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.4rem; }
  a { color: inherit; }
  canvas { width: 100%; aspect-ratio: 2 / 1; display: block; border-radius: 8px; border: 1px solid var(--line); }
  #hud { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; padding: .5rem .75rem; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-variant-numeric: tabular-nums; }
  #hud span b { font-weight: 600; }
  #stall { color: var(--warn); font-weight: 700; visibility: hidden; }
  #stall.on { visibility: visible; }
  form { display: flex; gap: .5rem; align-items: center; }
  input { width: 6rem; padding: .25rem .4rem; font: inherit; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
  button { padding: .25rem .75rem; font: inherit; cursor: pointer; }
  .help { color: var(--muted); margin: 0; }
  kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 .3rem; background: var(--panel); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Flight</h1>
    <a href="../../">All apps</a>
    <form id="level-form">
      <label for="seed">Seed</label>
      <input id="seed" data-testid="seed" type="number" value="1">
      <button id="restart" data-testid="restart" type="submit">Restart</button>
    </form>
  </header>
  <canvas id="game" data-testid="game" width="960" height="480"></canvas>
  <div id="hud" data-testid="hud">
    <span>Gates <b id="score" data-testid="score">0/0</b></span>
    <span>Speed <b id="speed" data-testid="speed">0</b> m/s</span>
    <span>Altitude <b id="altitude" data-testid="altitude">0</b> m</span>
    <span>Throttle <b id="throttle" data-testid="throttle">0%</b></span>
    <span>Fuel <b id="fuel" data-testid="fuel">100%</b></span>
    <span>Wind <b id="wind" data-testid="wind">0 m/s</b></span>
    <span id="status" data-testid="status">flying</span>
    <a id="share" data-testid="share" href="?run=">Share run</a>
    <span id="stall" data-testid="stall">STALL</span>
  </div>
  <p class="help"><kbd>↑</kbd>/<kbd>W</kbd> pitch up, <kbd>↓</kbd>/<kbd>S</kbd> pitch down, <kbd>→</kbd>/<kbd>D</kbd> more throttle, <kbd>←</kbd>/<kbd>A</kbd> less throttle, <kbd>R</kbd> restart. Fly through the gaps; too steep at low speed and the wing stalls.</p>
</main>
<script type="module" src="ui.js"></script>
</body>
</html>
